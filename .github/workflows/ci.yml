name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Accuracy + benchmark (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          npm ci
          pip install --disable-pip-version-check segno pillow numpy

      - name: Generate test corpus
        run: npm run assets

      - name: Node accuracy tests (29 single-code + 4 multi-code)
        run: npm test

      - name: Node accuracy tests (minimal-size build)
        run: node tests/run-tests.mjs --variant min --tiles 2

      - name: Benchmark vs zxing-wasm / jsQR (standard + min build)
        run: node tests/benchmark.mjs --tiles 2 --min

      - name: Real-browser verification (headless Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

      - name: Real-browser verification (minimal-size build)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser/run-browser-test.mjs --variant min

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: |
            build/browser-tests.png
            build/browser-tests-min.png
          if-no-files-found: ignore
